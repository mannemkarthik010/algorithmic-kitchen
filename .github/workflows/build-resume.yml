name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - "resume/resume.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume

      - name: Copy compiled PDF into public/
        run: cp resume/resume.pdf public/Karthik_Mannem_Resume.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/Karthik_Mannem_Resume.pdf
          git diff --staged --quiet || git commit -m "chore: auto-update resume PDF from LaTeX source"
          git push
